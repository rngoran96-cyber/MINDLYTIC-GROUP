<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gôly Express | Gestion de livraisons</title>
<style>
:root{--bg:#f8faf9;--card:#fff;--tx:#14201c;--mu:#667570;--bd:#e3e9e6;--pr:#2ba88a;--pr2:#e6f5f0;--or:#f0a31c;--rd:#e5484d;--sh:#f1f5f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#161f1c;--tx:#e8f0ed;--mu:#8fa19b;--bd:#26332f;--pr2:#17332b;--sh:#1b2623}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#161f1c;--tx:#e8f0ed;--mu:#8fa19b;--bd:#26332f;--pr2:#17332b;--sh:#1b2623}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--pr);padding:0 8px 18px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--pr);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.mn{font-size:12px;color:var(--mu);padding:6px 10px}
nav button,.out{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--tx);font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
nav button:hover,.out:hover{background:var(--sh)}nav button.on{background:var(--sh);font-weight:600}
.out{margin-top:auto;color:var(--mu)}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,48px) 60px;max-width:1000px}
h1{font-size:26px;margin:0}h2{font-size:18px;margin:26px 0 12px}.sub{color:var(--mu);margin:2px 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.st{border-left:4px solid var(--c);display:flex;justify-content:space-between;gap:8px}
.st b{font-size:28px;display:block;margin:4px 0}.st small{color:var(--mu)}
.ic{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.act{display:flex;gap:14px;align-items:center;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:20px;font:inherit;color:var(--tx);text-align:left;width:100%}
.act.p{background:var(--pr);border-color:var(--pr);color:#fff}.act strong{display:block;font-size:17px}.act span{font-size:13px;opacity:.8}
.act .ic{background:var(--pr2);color:var(--pr)}.act.p .ic{background:#ffffff30;color:#fff}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}.hint{font-size:12.5px;color:var(--mu);margin-top:4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.w{width:100%;margin-top:18px}
.tot{background:var(--sh);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:18px}.tot b{color:var(--pr);font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}.top>div{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:44px 10px}.empty .ic{margin:0 auto 12px;width:60px;height:60px;font-size:28px;background:none;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}.tag.or{background:#f0a31c22;color:var(--or)}.tag.rd{background:#e5484d22;color:var(--rd)}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:30}#toast.s{opacity:1;transform:none}
.mb{display:none}
@media(max-width:760px){aside{position:fixed;z-index:20;left:-240px;transition:.25s;width:230px}aside.o{left:0;box-shadow:0 0 0 100vmax #0006}.mb{display:inline-block;background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin-bottom:14px;color:var(--tx);font-size:18px}.row{grid-template-columns:1fr}}
body.auth aside,body.auth .mb{display:none}body.auth main{max-width:none}.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}
.lp{max-width:1000px;margin:0 auto}.lh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:6px 0 28px}.lnk{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.lnk a{color:var(--tx);cursor:pointer}.lnk a:hover{color:var(--pr)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding:20px 0 40px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.12;color:var(--pr)}.price{font-size:32px;font-weight:700;color:var(--pr);margin:6px 0}details{border-bottom:1px solid var(--bd);padding:12px 0}details:last-child{border:0}summary{cursor:pointer;font-weight:600}@media(max-width:760px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body class="auth">
<aside id="sb">
 <div class="logo"><i>G</i>Gôly Express</div>
 <div class="mn">Menu</div>
 <nav id="nav"></nav>
 <button class="out" onclick="logout()">⎋ Déconnexion</button>
</aside>
<main><button class="mb" onclick="sbar.classList.toggle('o')" aria-label="Menu">☰</button><div id="v"></div></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://VOTRE-PROJET.supabase.co',SUPABASE_KEY='sb_publishable_ar7Zw4haPE5pJfzwVcTJBw_Wy0jElr3';
const PRIX_ACTIVATION=120000,PRIX_MENSUEL=40000; // à garder identique à price_of() dans schema.sql
const PAY_INFOS=[['Wave','+225 00 00 00 00 00']]; // paiement manuel de secours : votre vrai numéro Wave
const $=s=>document.querySelector(s),sbar=$('#sb');
const NAV=[['dash','▦','Dashboard','a'],['new','⊕','Créer une commande','a'],['orders','🛍','Mes commandes','a'],['drv','👥','Mes livreurs','a'],['rep','🧾','Rapport des encaissements','a'],['sub','💳','Abonnement','a'],['valid','✅','Paiements à valider','p'],['mine','🛵','Mes livraisons','d'],['prof','◉','Mon profil','ad'],['fb','💬','Feedback','ad']];
let sb,me=null,drivers=[],orders=[],cur='dash',chan=null,sub=null,payments=[],isPA=false;
const F=n=>(+n||0).toLocaleString('fr-FR')+' FCFA';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const tot=o=>o.mode_paiement=='COD'?o.prix_produit+o.prix_livraison:0;
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',3200)}
const fail=e=>toast(/row-level security/i.test((e&&e.message)||'')?'Action refusée : abonnement expiré ou droits insuffisants.':'Erreur : '+((e&&e.message)||'réessayez'));
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('fr-FR'):'—';
const subOk=()=>!!(sub&&sub.paid_until&&sub.paid_until>=today());
const ptag=s=>`<span class="tag ${s=='Refusé'?'rd':s=='En attente'?'or':''}">${s}</span>`;
const sc=id=>document.getElementById(id).scrollIntoView({behavior:'smooth'});
const dn=id=>{const d=drivers.find(d=>d.id==id);return d?`${d.prenom||''} ${d.nom||''}`.trim():'Non assigné'};
const tag=s=>`<span class="tag ${s=='Problème'?'rd':s=='En cours'?'or':''}">${s}</span>`;
const card=(c,ic,t,v,s)=>`<div class="card st" style="--c:${c}"><div><span>${t}</span><b>${v}</b><small>${s}</small></div><div class="ic">${ic}</div></div>`;
const act=(p,ic,t,s,to)=>`<button class="act ${p}" onclick="go('${to}')"><span class="ic">${ic}</span><div><strong>${t}</strong><span>${s}</span></div></button>`;
const empty=(ic,t)=>`<div class="empty"><div class="ic">${ic}</div>${t}</div>`;
const gate=(t,s,x='')=>`<div class="card" style="max-width:480px;margin:8vh auto"><div class="logo" style="justify-content:center"><i>G</i>Gôly Express</div><h1 style="font-size:21px;text-align:center">${t}</h1><p class="sub" style="text-align:center">${s}</p>${x}</div>`;
function show(h){document.body.classList.add('auth');$('#v').innerHTML=h}
function go(p,keep){if(me.role=='admin'&&!subOk()&&!['sub','prof','fb','valid'].includes(p))p='sub';cur=p;document.body.classList.remove('auth');sbar.classList.remove('o');const r=me.role=='admin'?'a':'d';$('#nav').innerHTML=NAV.filter(n=>n[3]=='p'?isPA:n[3].includes(r)).map(n=>`<button class="${n[0]==p?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('');$('#v').innerHTML=V[p]();if(V[p+'_'])V[p+'_']();if(!keep)scrollTo(0,0)}
async function load(){const adm=me.role=='admin';const[o,d,s,pm,pa]=await Promise.all([sb.from('orders').select('*').order('id',{ascending:false}),adm?sb.from('profiles').select('*').eq('role','livreur').order('created_at'):{data:[]},adm?sb.from('subscriptions').select('*').maybeSingle():{data:null},adm?sb.from('payments').select('*').order('id',{ascending:false}):{data:[]},sb.rpc('is_platform_admin')]);orders=o.data||[];drivers=d.data||[];sub=s.data;payments=pm.data||[];isPA=!!pa.data}
function live(){if(chan)sb.removeChannel(chan);const f=async()=>{await load();if(!['new','newdrv','fb','prof'].includes(cur))go(cur,true)};chan=sb.channel('gx');['orders','profiles','subscriptions','payments'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},f));chan.subscribe()}
async function start(u){let{data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
if(!p){const m=u.user_metadata||{};if(m.role){const r=await sb.from('profiles').insert({id:u.id,role:m.role,admin_id:m.role=='livreur'?m.admin_id:null,prenom:m.prenom,nom:m.nom,tel:m.tel,entreprise:m.entreprise,email:u.email}).select().single();p=r.data}}
if(!p){show(gate('Compte désactivé','Ce compte n’est rattaché à aucun gestionnaire. Contactez votre gestionnaire Gôly Express.','<button class="btn w" onclick="logout()">Se déconnecter</button>'));return}
me=p;await load();live();go(me.role=='admin'?'dash':'mine');const q=new URLSearchParams(location.search).get('paiement');if(q){history.replaceState(null,'',location.pathname);toast(q=='ok'?'Paiement reçu. Votre accès s’ouvre dans quelques secondes.':'Paiement annulé ou échoué.');if(q=='ok'&&me.role=='admin')go('sub')}}
async function logout(){await sb.auth.signOut();me=null;landing()}
function authView(m='in'){show(gate(m=='in'?'Connexion':'Créer mon compte',m=='in'?'Accédez à votre espace de livraison':'Gestionnaire : créez votre espace Gôly Express',
`<div class="tabs"><button class="btn ${m=='in'?'':'o'}" onclick="authView('in')">Connexion</button><button class="btn ${m=='up'?'':'o'}" onclick="authView('up')">Créer un compte</button></div>
${m=='up'?`<label>Nom de l’entreprise</label><input id="en"><div class="row"><div><label>Prénom</label><input id="pn"></div><div><label>Nom</label><input id="nm"></div></div><label>Téléphone</label><input id="tl" type="tel">`:''}
<label>Email</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" placeholder="Minimum 6 caractères" autocomplete="${m=='in'?'current-password':'new-password'}">
<button class="btn w" onclick="${m=='in'?'login()':'signup()'}">${m=='in'?'Se connecter':'Créer mon compte'}</button><p style="text-align:center;margin-bottom:0"><a style="color:var(--pr);cursor:pointer" onclick="landing()">← Retour au site</a></p>`))}
async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('Email ou mot de passe incorrect');start(data.user)}
async function signup(){const v=i=>$('#'+i).value.trim(),pw=$('#pw').value;if(!v('em')||pw.length<6||!v('pn')||!v('en'))return toast('Remplissez l’entreprise, le prénom, l’email et un mot de passe (6 caractères min.)');
const{data,error}=await sb.auth.signUp({email:v('em'),password:pw,options:{data:{role:'admin',entreprise:v('en'),prenom:v('pn'),nom:v('nm'),tel:v('tl')}}});if(error)return fail(error);
if(!data.session)return toast('Compte créé. Confirmez votre email, puis connectez-vous.');start(data.user)}
const V={
dash(){const o=orders,c=o.filter(x=>x.statut=='En cours').length,r=o.filter(x=>x.statut=='Livrée').length,p=o.filter(x=>x.statut=='Problème').length,ca=o.filter(x=>x.statut=='Livrée').reduce((a,x)=>a+x.prix_produit+x.prix_livraison,0);
return `<h1>Bienvenue ${esc(me.prenom||'')} 👋</h1><p class="sub">Gérez vos livraisons facilement</p>${dueBanner()}<h2 style="margin-top:0">Livraisons</h2><div class="grid g4">${card('#f0a31c','↗','En cours',c,'Livraisons en cours')}${card('#2ba88a','✓','Réussies',r,'Livraisons réussies')}${card('#e5484d','⚠','Problèmes',p,'Situations critiques')}${card('#2ba88a','◎','Chiffre d’affaires',F(ca),'Revenu des livraisons réussies')}</div><h2>Actions rapides</h2><div class="grid g2">${act('p','⊕','Créer une commande','Nouvelle livraison','new')}${act('','🛍','Mes commandes','Voir toutes mes commandes','orders')}${act('','👥','Mes livreurs','Gérer les livreurs','drv')}${act('','🧾','Rapport des encaissements','Suivre les paiements et COD','rep')}</div>`},
new(){return `<div class="card" style="max-width:620px"><h1 style="font-size:22px">Créer une commande</h1><p class="sub">Remplissez les informations de livraison</p>
<label>Nom du client</label><input id="n" placeholder="Ex: Jean Kouassi"><label>Téléphone du client</label><input id="t" type="tel" placeholder="Ex: 07 XX XX XX XX"><label>Lieu de livraison précis</label><textarea id="l" rows="3" placeholder="Ex: Rue 12, en face de la pharmacie moderne"></textarea><div class="hint">Adresse exacte où livrer (rue, numéro, repère…)</div>
<label>Produit à livrer</label><input id="p" placeholder="Ex: colis, nourriture, document…"><div class="row"><div><label>Prix du produit (FCFA)</label><input id="pp" type="number" min="0" value="0"></div><div><label>Prix de la livraison (FCFA)</label><input id="pl" type="number" min="0" value="0"></div></div>
<label>Mode de paiement</label><select id="m"><option value="COD">COD (Cash on Delivery)</option><option value="ELEC">Paiement électronique</option></select>
<label>Attribuer à un livreur (optionnel)</label><select id="d"><option value="">Choisir un livreur (optionnel)</option>${drivers.map(d=>`<option value="${d.id}">${esc(dn(d.id))}</option>`).join('')}</select>
<div class="tot"><div><b style="font-size:15px;color:var(--tx)">Montant total à encaisser</b><div class="hint">Ce que le livreur doit récupérer auprès du client</div></div><b id="tt">0 FCFA</b></div><button class="btn w" onclick="addOrder()">Créer la commande</button></div>`},
new_(){const u=()=>$('#tt').textContent=F($('#m').value=='COD'?(+$('#pp').value||0)+(+$('#pl').value||0):0);['pp','pl','m'].forEach(i=>$('#'+i).addEventListener('input',u))},
orders(){return `<div class="top"><h1 style="font-size:22px">Mes commandes</h1><div><button class="btn o" onclick="go('drv')">👥 Mes livreurs</button><button class="btn" onclick="go('new')">⊕ Créer une commande</button></div></div><div class="card">${orders.length?`<div class="tw"><table><tr><th>N°</th><th>Client</th><th>Lieu</th><th>À encaisser</th><th>Livreur</th><th>Statut</th></tr>${orders.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.client_nom)}<br><small style="color:var(--mu)">${esc(x.client_tel)}</small></td><td>${esc(x.lieu)}</td><td>${F(tot(x))}</td><td><select onchange="upd(${x.id},{livreur_id:this.value||null})"><option value="">Non assigné</option>${drivers.map(d=>`<option value="${d.id}" ${d.id==x.livreur_id?'selected':''}>${esc(dn(d.id))}</option>`).join('')}</select></td><td><select onchange="upd(${x.id},{statut:this.value})">${['En cours','Livrée','Problème'].map(s=>`<option ${s==x.statut?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:empty('🛍','Vous n’avez pas encore créé de commande')}</div>`},
drv(){return `<div class="top"><div><h1 style="font-size:22px">Mes livreurs</h1><p class="sub" style="margin:0">${drivers.length?drivers.length+' livreur(s)':'Aucun livreur pour le moment'}</p></div><button class="btn" onclick="go('newdrv')">+ Ajouter un livreur</button></div><div class="card">${drivers.length?`<div class="tw"><table><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Livraisons</th><th></th></tr>${drivers.map(d=>`<tr><td>${esc(dn(d.id))}</td><td>${esc(d.tel)}</td><td>${esc(d.email)}</td><td>${orders.filter(o=>o.livreur_id==d.id).length}</td><td><button class="btn o" onclick="delDrv('${d.id}')">Retirer</button></td></tr>`).join('')}</table></div>`:empty('👤','Vous n’avez pas encore créé de livreur<br><br><button class="btn" onclick="go(\'newdrv\')">Créer votre premier livreur</button>')}</div>`},
newdrv(){return `<div class="card" style="max-width:620px"><h1 style="font-size:22px">Créer un livreur</h1><p class="sub">Remplissez les informations du livreur</p><div class="row"><div><label>Prénom *</label><input id="a" placeholder="Ex: Jean"></div><div><label>Nom *</label><input id="b" placeholder="Ex: Kouassi"></div></div><label>Numéro de téléphone *</label><input id="c" placeholder="Ex: +225 07 XX XX XX XX"><label>Email *</label><input id="e" type="email" placeholder="Ex: jean.kouassi@email.com"><div class="hint">Le livreur utilisera cet email pour se connecter</div><label>Mot de passe *</label><input id="w" type="password" placeholder="Minimum 6 caractères"><div class="hint">Le livreur pourra modifier son mot de passe après la première connexion</div><button class="btn w" onclick="addDrv()">Créer le livreur</button></div>`},
rep(){return `<div class="top"><div><h1 style="font-size:22px">Rapport des encaissements</h1><p class="sub" style="margin:0">Suivez tous les encaissements COD et paiements électroniques</p></div><div><button class="btn o" onclick="window.print()">Exporter en PDF</button><button class="btn o" onclick="csv()">Exporter en Excel</button></div></div>
<div class="card"><h2 style="margin:0 0 12px">Filtres</h2><div class="row" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div><label style="margin-top:0">Livreur</label><select id="fd"><option value="">Tous les livreurs</option>${drivers.map(d=>`<option value="${d.id}">${esc(dn(d.id))}</option>`).join('')}</select></div><div><label style="margin-top:0">Date de début</label><input id="d1" type="date" value="${today()}"></div><div><label style="margin-top:0">Date de fin</label><input id="d2" type="date" value="${today()}"></div><div><label style="margin-top:0">Statut</label><select id="fs"><option value="">Tous</option><option>En cours</option><option>Livrée</option><option>Problème</option></select></div></div></div><div id="rr"></div>`},
rep_(){const r=()=>{const a=$('#fd').value,s=$('#fs').value,x=$('#d1').value,y=$('#d2').value;const L=orders.filter(o=>{const d=o.created_at.slice(0,10);return(!a||o.livreur_id==a)&&(!s||o.statut==s)&&d>=x&&d<=y});window.RL=L;const cod=L.filter(o=>o.mode_paiement=='COD').reduce((q,o)=>q+o.prix_produit+o.prix_livraison,0),pe=L.filter(o=>o.mode_paiement!='COD').reduce((q,o)=>q+o.prix_produit+o.prix_livraison,0),pr=L.reduce((q,o)=>q+o.prix_produit,0),lv=L.reduce((q,o)=>q+o.prix_livraison,0);
$('#rr').innerHTML=`<div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['Total COD',cod],['Paiements électroniques',pe],['Total produits',pr],['Total frais livraison',lv],['Total général',pr+lv]].map(z=>`<div class="card"><small style="color:var(--mu)">${z[0]}</small><b style="display:block;color:var(--pr);font-size:19px">${F(z[1])}</b></div>`).join('')}</div><h2>Détails des encaissements</h2><div class="card"><small style="color:var(--mu)">${L.length} commande(s) trouvée(s)</small>${L.length?`<div class="tw"><table><tr><th>N°</th><th>Client</th><th>Livreur</th><th>Paiement</th><th>Montant</th><th>Statut</th></tr>${L.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.client_nom)}</td><td>${esc(dn(o.livreur_id))}</td><td>${o.mode_paiement=='COD'?'COD':'Électronique'}</td><td>${F(o.prix_produit+o.prix_livraison)}</td><td>${tag(o.statut)}</td></tr>`).join('')}</table></div>`:''}</div>`};document.querySelectorAll('#fd,#d1,#d2,#fs').forEach(e=>e.addEventListener('input',r));r()},
mine(){return `<h1>Mes livraisons</h1><p class="sub">${orders.length?orders.length+' commande(s) qui vous sont attribuées':'Aucune livraison attribuée pour le moment'}</p>${orders.map(o=>`<div class="card" style="margin-bottom:12px"><div class="top" style="margin:0 0 8px"><b>#${o.id} · ${esc(o.client_nom)}</b>${tag(o.statut)}</div><div>📞 <a href="tel:${esc(o.client_tel)}" style="color:var(--pr)">${esc(o.client_tel)}</a></div><div>📍 ${esc(o.lieu)}</div><div>📦 ${esc(o.produit)}</div><div class="tot"><span>À encaisser</span><b>${F(tot(o))}</b></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="upd(${o.id},{statut:'Livrée'})">Marquer livrée</button><button class="btn o" onclick="upd(${o.id},{statut:'Problème'})">Signaler un problème</button></div></div>`).join('')}`},
prof(){return `<h1>Mon profil</h1><p class="sub">Gérez votre compte</p><div class="card" style="max-width:620px"><h2 style="margin-top:0">Informations</h2><div class="row"><div><label style="margin-top:0">Prénom</label><input id="pn" value="${esc(me.prenom)}"></div><div><label style="margin-top:0">Nom</label><input id="nm" value="${esc(me.nom)}"></div></div><label>Téléphone</label><input id="tl" value="${esc(me.tel)}">${me.role=='admin'?`<label>Entreprise</label><input id="en" value="${esc(me.entreprise)}">`:''}<div class="hint">${esc(me.email)} · ${me.role=='admin'?'Gestionnaire':'Livreur'}</div><button class="btn w" onclick="saveProf()">Enregistrer</button></div>
<div class="card" style="max-width:620px;margin-top:14px"><h2 style="margin-top:0">Sécurité</h2><label style="margin-top:0">Nouveau mot de passe</label><input id="p1" type="password" placeholder="Minimum 6 caractères"><label>Confirmer le mot de passe</label><input id="p2" type="password" placeholder="Retapez votre mot de passe"><button class="btn w" onclick="chgPw()">Changer le mot de passe</button></div>`},
sub(){const act=subOk(),pend=payments.find(p=>p.status=='En attente'),next=sub&&sub.setup_paid?'MENSUEL':'ACTIVATION',amt=next=='ACTIVATION'?PRIX_ACTIVATION:PRIX_MENSUEL;
return `<h1>Abonnement</h1><p class="sub">Gérez votre abonnement et votre facturation</p><div class="card" style="max-width:620px"><h2 style="margin-top:0">Votre plan</h2>${act?`<span class="tag">Actif</span> jusqu’au <b>${fd(sub.paid_until)}</b>`:`<span class="tag rd">${sub&&sub.setup_paid?'Expiré':'Non activé'}</span> Payez pour utiliser Gôly Express.`}
<div class="tot"><div><b style="font-size:15px;color:var(--tx)">${next=='ACTIVATION'?'Activation (première utilisation)':'Abonnement mensuel'}</b><div class="hint">${next=='ACTIVATION'?'Paiement unique, 30 premiers jours inclus':'30 jours d’accès de plus'}</div></div><b>${F(amt)}</b></div>
<button class="btn w" onclick="payWave()">Payer ${F(amt)} avec Wave</button><div class="hint">Paiement sécurisé dans l’application Wave. Votre accès s’ouvre automatiquement.</div>${pend?`<p class="hint" style="margin-top:14px">Votre paiement de ${F(pend.amount)} (réf. ${esc(pend.reference)}) est en attente de validation.</p>`:`<details style="margin-top:14px"><summary class="hint">Payer autrement (déclaration manuelle)</summary><label>Comment payer</label>${PAY_INFOS.map(x=>`<div class="hint">${x[0]} : <b>${x[1]}</b></div>`).join('')}<label>Moyen utilisé</label><select id="pm">${PAY_INFOS.map(x=>`<option>${x[0]}</option>`).join('')}</select><label>Référence de la transaction</label><input id="pr" placeholder="Numéro de transaction reçu par SMS"><button class="btn w" onclick="declarePay('${next}')">J’ai payé ${F(amt)}</button></details>`}</div>
<h2>Historique</h2><div class="card">${payments.length?`<div class="tw"><table><tr><th>Date</th><th>Type</th><th>Montant</th><th>Référence</th><th>Statut</th></tr>${payments.map(p=>`<tr><td>${fd(p.created_at.slice(0,10))}</td><td>${p.kind=='ACTIVATION'?'Activation':'Mensuel'}</td><td>${F(p.amount)}</td><td>${esc(p.reference)}</td><td>${ptag(p.status)}</td></tr>`).join('')}</table></div>`:empty('💳','Aucun paiement pour le moment')}</div>`},
valid(){return `<div class="top"><h1 style="font-size:22px">Paiements à valider</h1><button class="btn o" onclick="loadPay()">Actualiser</button></div><div class="card" id="vp">Chargement…</div>`},
valid_(){loadPay()},
fb(){return `<h1>Feedback</h1><p class="sub">Aidez-nous à améliorer Gôly Express</p><div class="card" style="max-width:620px"><label style="margin-top:0">Type</label><select id="ft"><option>Signaler un bug</option><option>Proposer une amélioration</option></select><label>Votre message</label><textarea id="fm" rows="5" placeholder="Décrivez le problème ou votre idée"></textarea><button class="btn w" onclick="sendFb()">Envoyer</button></div>`}
};
async function addOrder(){const n=$('#n').value.trim(),t=$('#t').value.trim(),l=$('#l').value.trim(),p=$('#p').value.trim();if(!n||!t||!l||!p)return toast('Renseignez le client, le téléphone, le lieu et le produit');
const{error}=await sb.from('orders').insert({admin_id:me.id,client_nom:n,client_tel:t,lieu:l,produit:p,prix_produit:+$('#pp').value||0,prix_livraison:+$('#pl').value||0,mode_paiement:$('#m').value,livreur_id:$('#d').value||null});if(error)return fail(error);toast('Commande créée');await load();go('orders')}
async function upd(id,patch){const{error}=await sb.from('orders').update(patch).eq('id',id);if(error)return fail(error);toast('Commande mise à jour')}
async function addDrv(){const v=i=>$('#'+i).value.trim();if(!v('a')||!v('b')||!v('c')||!v('e'))return toast('Remplissez tous les champs obligatoires');if($('#w').value.length<6)return toast('Mot de passe : 6 caractères minimum');
const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const row={role:'livreur',admin_id:me.id,prenom:v('a'),nom:v('b'),tel:v('c'),email:v('e')};
const{data,error}=await tmp.auth.signUp({email:v('e'),password:$('#w').value,options:{data:row}});if(error)return fail(error);
if(!data.session)return toast('Compte créé, mais l’email doit être confirmé : désactivez « Confirm email » dans Supabase.');
const r=await tmp.from('profiles').insert({id:data.user.id,...row});if(r.error)return fail(r.error);toast('Livreur créé');await load();go('drv')}
async function delDrv(id){if(!confirm('Retirer ce livreur ? Il ne pourra plus accéder à l’application.'))return;const{error}=await sb.from('profiles').delete().eq('id',id);if(error)return fail(error);await load();go('drv')}
async function saveProf(){const p={prenom:$('#pn').value.trim(),nom:$('#nm').value.trim(),tel:$('#tl').value.trim()};if(me.role=='admin')p.entreprise=$('#en').value.trim();const{error}=await sb.from('profiles').update(p).eq('id',me.id);if(error)return fail(error);Object.assign(me,p);toast('Profil enregistré')}
async function chgPw(){const a=$('#p1').value;if(a.length<6)return toast('Mot de passe : 6 caractères minimum');if(a!==$('#p2').value)return toast('Les mots de passe ne correspondent pas');const{error}=await sb.auth.updateUser({password:a});if(error)return fail(error);$('#p1').value=$('#p2').value='';toast('Mot de passe mis à jour')}
async function sendFb(){const m=$('#fm').value.trim();if(!m)return toast('Écrivez un message');const{error}=await sb.from('feedback').insert({type:$('#ft').value,message:m});if(error)return fail(error);toast('Merci pour votre retour');go(me.role=='admin'?'dash':'mine')}
function csv(){const L=window.RL||[];if(!L.length)return toast('Aucune donnée à exporter');const r=[['N°','Client','Livreur','Paiement','Montant','Statut'],...L.map(o=>[o.id,o.client_nom,dn(o.livreur_id),o.mode_paiement=='COD'?'COD':'Électronique',o.prix_produit+o.prix_livraison,o.statut])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.join(';')).join('\n')],{type:'text/csv'}));a.download='encaissements.csv';a.click()}
(async()=>{
if(SUPABASE_URL.includes('VOTRE-PROJET')){show(gate('Configuration requise','Ouvrez index.html et remplacez SUPABASE_URL et SUPABASE_KEY en haut du script (voir LISEZMOI.md).'));return}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const{data:{session}}=await sb.auth.getSession();
sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&me){me=null;landing()}});
session?start(session.user):landing();
})();

function dueBanner(){if(me.role!='admin'||!subOk())return'';const left=Math.ceil((new Date(sub.paid_until+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);return left<=5?`<div class="card" style="border-color:var(--or);margin-bottom:16px">⚠ Votre abonnement expire dans ${left} jour(s). <a style="color:var(--pr);cursor:pointer" onclick="go('sub')">Renouveler</a></div>`:''}
async function declarePay(kind){const r=$('#pr').value.trim();if(r.length<4)return toast('Saisissez la référence de la transaction');const{error}=await sb.from('payments').insert({admin_id:me.id,kind,amount:kind=='ACTIVATION'?PRIX_ACTIVATION:PRIX_MENSUEL,method:$('#pm').value,reference:r});if(error)return fail(/duplicate|unique/i.test(error.message)?{message:'Cette référence a déjà été utilisée'}:error);toast('Paiement envoyé, en attente de validation');await load();go('sub')}
async function loadPay(){const{data,error}=await sb.rpc('payments_to_review');if(error)return fail(error);const el=$('#vp');if(!el)return;el.innerHTML=data.length?`<div class="tw"><table><tr><th>Date</th><th>Entreprise</th><th>Contact</th><th>Type</th><th>Montant</th><th>Moyen / réf.</th><th>Statut</th><th></th></tr>${data.map(p=>`<tr><td>${fd(p.created_at.slice(0,10))}</td><td>${esc(p.entreprise)}</td><td>${esc(p.email)}<br><small>${esc(p.tel)}</small></td><td>${p.kind=='ACTIVATION'?'Activation':'Mensuel'}</td><td>${F(p.amount)}</td><td>${esc(p.method)}<br><small>${esc(p.reference)}</small></td><td>${ptag(p.status)}</td><td>${p.status=='En attente'?`<button class="btn" onclick="review(${p.id},true)">Valider</button> <button class="btn o" onclick="review(${p.id},false)">Refuser</button>`:''}</td></tr>`).join('')}</table></div>`:empty('✅','Aucun paiement')}
async function review(id,ok){const{error}=await sb.rpc('review_payment',{pid:id,ok});if(error)return fail(error);toast(ok?'Paiement validé':'Paiement refusé');loadPay()}
function landing(){const feat=[['🛍','Commandes en un clic','Créez une livraison en quelques secondes : client, lieu, produit, prix.'],['👥','Un compte par livreur','Chaque livreur a son accès et voit uniquement ses livraisons.'],['💵','Encaissements COD','Suivez ce que chaque livreur doit récupérer et ce qui est encaissé.'],['🧾','Rapports et exports','Filtrez par livreur, date et statut. Export Excel et PDF.'],['⚡','Suivi en direct','Les statuts se mettent à jour en temps réel chez tout le monde.'],['📱','Fait pour le téléphone','Une interface simple qui s’adapte à tous les écrans.']];
const faq=[['Comment payer ?','Par Wave. Vous cliquez sur « Payer avec Wave », vous réglez dans l’application Wave et votre accès s’ouvre automatiquement.'],['Que se passe-t-il si je ne renouvelle pas ?','Vous ne pouvez plus créer ni modifier de commandes. Vos données sont conservées et l’accès revient dès le paiement validé.'],['Mes livreurs doivent-ils payer ?','Non. Seul le gestionnaire paie l’abonnement.'],['Mes données sont-elles privées ?','Oui. Chaque gestionnaire voit uniquement ses commandes et ses livreurs.']];
show(`<div class="lp"><div class="lh"><div class="logo" style="padding:0"><i>G</i>Gôly Express</div><div class="lnk"><a onclick="sc('fn')">Fonctionnalités</a><a onclick="sc('tf')">Tarifs</a><a onclick="sc('fq')">FAQ</a><button class="btn" onclick="authView('in')">Espace client</button></div></div>
<div class="hero"><div><h1>Gôly Express : gérez vos livreurs et vos encaissements à la livraison</h1><p class="sub" style="font-size:17px">Commandes, livreurs et paiements à la livraison (COD) au même endroit. Simple et rapide, pensé pour les services de livraison.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="authView('up')">Créer mon compte</button><button class="btn o" onclick="sc('tf')">Voir les tarifs</button></div></div>
<div class="card"><b>Aperçu du dashboard</b><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:12px">${[['Commandes','24'],['Livrées','18'],['Encaissements','450K']].map(x=>`<div class="card" style="padding:12px"><small style="color:var(--mu)">${x[0]}</small><b style="display:block;font-size:20px">${x[1]}</b></div>`).join('')}</div><div class="hint" style="margin-top:10px">Chiffres donnés à titre d’exemple</div></div></div>
<h2 id="fn">Fonctionnalités</h2><div class="grid g2">${feat.map(x=>`<div class="card"><div class="ic" style="--c:var(--pr);margin-bottom:10px">${x[0]}</div><b>${x[1]}</b><div class="hint" style="font-size:14px">${x[2]}</div></div>`).join('')}</div>
<h2 id="tf">Tarifs</h2><div class="grid g2"><div class="card"><b>Activation</b><div class="hint">Première utilisation</div><div class="price">${F(PRIX_ACTIVATION)}</div><div class="hint" style="font-size:14px">Paiement unique. Crée votre espace et inclut les 30 premiers jours.</div><button class="btn w" onclick="authView('up')">Créer mon compte</button></div><div class="card"><b>Abonnement mensuel</b><div class="hint">Ensuite</div><div class="price">${F(PRIX_MENSUEL)}</div><div class="hint" style="font-size:14px">Par mois, pour continuer après les 30 premiers jours. Livreurs et commandes illimités.</div><button class="btn o w" onclick="authView('up')">Créer mon compte</button></div></div>
<h2 id="fq">Questions fréquentes</h2><div class="card">${faq.map(x=>`<details><summary>${x[0]}</summary><p class="hint" style="font-size:14px">${x[1]}</p></details>`).join('')}</div>
<p class="hint" style="text-align:center;margin-top:30px">© Gôly Express</p></div>`)}

async function payWave(){toast('Ouverture de Wave…');const{data,error}=await sb.functions.invoke('wave-checkout');if(error||!data||!data.url)return toast((data&&data.error)||'Impossible d’ouvrir Wave, réessayez');location.href=data.url}
</script>
</body>
